<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost in traffic — Mo Phillips</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Onest:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #232323; --sun: #FFC531; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: var(--ink); font: 400 17px/1.6 "Onest", system-ui, sans-serif; padding: 24px 16px; overflow-x: hidden; }
    main { max-width: 640px; text-align: center; }
    h1 { margin: 0; font: 400 clamp(90px, 22vw, 200px)/0.9 "Instrument Serif", Georgia, serif; letter-spacing: -0.03em; }
    h2 { margin: 12px 0 10px; font: italic 400 clamp(28px, 5vw, 40px)/1.1 "Instrument Serif", Georgia, serif; }
    p { margin: 0 auto; max-width: 42ch; color: #5a5a5a; }
    .road { position: relative; height: 90px; margin: 36px 0; background: #3B3F52; border-radius: 16px; overflow: hidden; }
    .road::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px; background: repeating-linear-gradient(90deg, transparent 0 30px, rgba(255,255,255,.6) 30px 56px); }
    .danfo { position: absolute; top: 18px; left: -140px; width: 120px; height: 44px; background: var(--sun); border-radius: 10px 18px 6px 6px; box-shadow: inset 0 -7px 0 #1c1c1c; animation: drive 4s linear infinite; }
    @keyframes drive { to { left: 110%; } }
    a { display: inline-block; margin-top: 28px; padding: 13px 24px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 600; text-decoration: none; }
    a:hover { background: #000; }
    a:focus-visible { outline: 3px solid #5AA9FF; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .danfo { animation: none; left: 40%; } }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <h2>this page is stuck in go-slow</h2>
    <p>The page you wanted doesn't exist, or it moved. The danfo is going back to the homepage. Hop in.</p>
    <div class="road" aria-hidden="true"><span class="danfo"></span></div>
    <a href="/">Back to the homepage</a>
  </main>
</body>
</html>
